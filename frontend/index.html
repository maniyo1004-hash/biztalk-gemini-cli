<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 말투 변환기</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Pretendard 폰트 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 업무 말투 변환기</h1>
            <p>일상적인 말투를 정중한 업무 어조로 바꿔보세요.</p>
        </header>

        <main>
            <section class="input-section">
                <label for="inputText">원문 입력</label>
                <textarea id="inputText" placeholder="상사, 동료에게 보낼 내용을 자유롭게 입력하세요... (예: 내일까지 보고서 못할거 같아)"></textarea>
            </section>

            <section class="selection-section">
                <label>수신 대상 선택</label>
                <div class="button-group">
                    <button type="button" class="target-btn" data-target="boss">상사 / 임원</button>
                    <button type="button" class="target-btn" data-target="colleague">타팀 동료</button>
                    <button type="button" class="target-btn" data-target="client">고객 / 외부</button>
                    <button type="button" class="target-btn" data-target="team">팀 내 동료</button>
                </div>
            </section>

            <div class="action-section">
                <button id="convertBtn" class="primary-btn">변환하기</button>
            </div>

            <section class="output-section">
                <label for="outputText">변환 결과</label>
                <div class="result-container">
                    <textarea id="outputText" readonly placeholder="변환 결과가 여기에 표시됩니다."></textarea>
                    <button id="copyBtn" class="secondary-btn">복사하기</button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 업무 말투 변환기. All rights reserved.</p>
        </footer>
    </div>

    <!-- 로딩 스피너 -->
    <div id="loader" class="hidden">
        <div class="spinner"></div>
        <p>말투를 다듬는 중입니다...</p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
